[package]
name = "deepseek-glass"
version = "0.1.0"
description = "Frosted launcher for the DeepSeek web chat on macOS and Linux"
authors = ["DeepSeek Glass"]
license = "MIT"
repository = "https://github.com/yunhungo/x-deepseek-quick"
edition = "2024"

[lib]
name = "deepseek_glass_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = { version = "0.18", features = ["v3_24"] }
gtk = { version = "0.18", features = ["v3_24"] }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor", "objc2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
