[package]
name = "deepseek-glass"
version = "0.1.0"
description = "Frosted launcher for the DeepSeek web chat on macOS and Linux"
authors = ["DeepSeek Glass"]
edition = "2024"

[lib]
name = "deepseek_glass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = { version = "0.18", features = ["v3_24"] }
gtk = { version = "0.18", features = ["v3_24"] }
x11rb = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
