<!doctype html>
<!--
 @created 2026-11-10
 @description DeepSeek 面板工具栏与网页容器
 @author yunhungo
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSQuick</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header id="toolbar">
      <img src="icons/32.png" width="24" height="24" alt="" /><strong
        >DSQuick</strong
      >
      <button
        id="pick"
        title="选择网页元素"
        aria-label="选择网页元素"
        class="icon-button"
      >
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#target"></use>
        </svg>
      </button>
      <button
        id="page"
        title="添加整页"
        aria-label="添加整页"
        class="icon-button"
      >
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#page"></use>
        </svg>
      </button>
      <button
        id="theme"
        title="外观"
        aria-label="外观"
        aria-haspopup="menu"
        aria-expanded="false"
        aria-controls="theme-menu"
        class="icon-button"
      >
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#theme"></use>
        </svg>
      </button>
      <button
        id="pin"
        title="固定到侧栏"
        aria-label="固定到侧栏"
        class="icon-button"
      >
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#open"></use>
        </svg>
      </button>
      <button
        id="login"
        title="在官网登录"
        aria-label="在官网登录"
        class="icon-button"
      >
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#external"></use>
        </svg>
      </button>
      <button id="close" title="关闭" aria-label="关闭" class="icon-button">
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#close"></use>
        </svg>
      </button>
    </header>
    <div id="theme-menu" role="menu" aria-label="外观" hidden>
      <button
        type="button"
        role="menuitemradio"
        data-theme-choice="system"
        aria-checked="true"
      >
        <span>跟随系统</span><span class="check" aria-hidden="true">✓</span>
      </button>
      <button
        type="button"
        role="menuitemradio"
        data-theme-choice="light"
        aria-checked="false"
      >
        <span>浅色</span><span class="check" aria-hidden="true">✓</span>
      </button>
      <button
        type="button"
        role="menuitemradio"
        data-theme-choice="dark"
        aria-checked="false"
      >
        <span>深色</span><span class="check" aria-hidden="true">✓</span>
      </button>
    </div>
    <main>
      <iframe id="chat" title="DeepSeek" allow="clipboard-write"></iframe>
    </main>
    <div id="notice" role="status" hidden>
      <span></span
      ><button aria-label="关闭提示" class="icon-button">
        <svg
          class="ui-icon"
          aria-hidden="true"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons.svg#close"></use>
        </svg>
      </button>
    </div>
    <script src="panel.js" type="module"></script>
  </body>
</html>
